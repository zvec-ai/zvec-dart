name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      hosted_version:
        description: Build the example against this published version.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sdk-floor:
    if: ${{ !inputs.hosted_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
      - run: flutter pub get && flutter analyze --no-fatal-infos
      - run: flutter pub get && flutter analyze --no-fatal-infos
        working-directory: example
      - run: flutter test test/zvec_test.dart

  consumer:
    name: ${{ matrix.sdk || matrix.target }} consumer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos, runner: macos-15, sdk: osx-arm64, library: libzvec_c_api.dylib}
          - {target: linux, runner: ubuntu-24.04, sdk: linux-amd64, library: libzvec_c_api.so}
          - {target: linux, runner: ubuntu-24.04-arm, sdk: linux-arm64, library: libzvec_c_api.so}
          - {target: windows, runner: windows-2022, sdk: windows-amd64, library: zvec_c_api.dll}
          - {target: android, runner: ubuntu-24.04}
          - {target: ios, runner: macos-15}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.sdk != 'linux-arm64'
        with:
          channel: stable
      # Flutter distributes arm64 Linux engine artifacts separately from the
      # x64-only Linux SDK archive. Its launcher fetches the native Dart SDK.
      - if: matrix.sdk == 'linux-arm64'
        name: Set up Flutter for Linux arm64
        run: |
          sdk="$RUNNER_TEMP/flutter"
          git clone --quiet --depth 1 --branch stable https://github.com/flutter/flutter.git "$sdk"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$sdk" >> "$GITHUB_ENV"
          "$sdk/bin/flutter" --version
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libaio-dev xvfb xauth
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Test against the official native SDK
        if: matrix.sdk && !inputs.hosted_version
        env:
          SDK_TARGET: ${{ matrix.sdk }}
          SDK_LIBRARY: ${{ matrix.library }}
        run: |
          flutter pub get
          dart tool/fetch_zvec.dart --target "$SDK_TARGET" --output build/test-sdk
          export ZVEC_LIBRARY_PATH="$PWD/build/test-sdk/lib/$SDK_LIBRARY"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export ZVEC_LIBRARY_PATH="$(cygpath -w "$ZVEC_LIBRARY_PATH")"
          fi
          flutter test
          (cd example && flutter pub get && flutter test test/jieba_fts_integration_test.dart test/release_runtime_smoke_test.dart)

      - name: Read a database created with the 0.5.2 release
        if: matrix.target == 'macos' && !inputs.hosted_version
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o old.zip https://github.com/zvec-ai/zvec-dart/releases/download/v0.5.2/zvec-framework-macos-arm64.zip
          echo "2062a327681e95bd1dfbc8b5f523470734af3205ff6b41cb8f79e1216f582adb  old.zip" | shasum -a 256 -c -
          unzip -q old.zip -d old
          cd "$GITHUB_WORKSPACE"
          ZVEC_LIBRARY_PATH="$RUNNER_TEMP/old/zvec_native.framework/zvec_native" dart run test/fixtures/collection_upgrade.dart create "$RUNNER_TEMP/old-db"
          ZVEC_LIBRARY_PATH="$PWD/build/test-sdk/lib/libzvec_c_api.dylib" dart run test/fixtures/collection_upgrade.dart verify "$RUNNER_TEMP/old-db"

      - name: Prepare consumer
        working-directory: example
        env:
          TARGET: ${{ matrix.target }}
          HOSTED_VERSION: ${{ inputs.hosted_version }}
        run: |
          flutter create --no-pub --platforms="$TARGET" .
          if [[ -n "$HOSTED_VERSION" ]]; then
            for attempt in {1..10}; do
              if flutter pub add "zvec:$HOSTED_VERSION"; then break; fi
              if [[ "$attempt" == 10 ]]; then exit 1; fi
              sleep 30
            done
          fi
          flutter pub get
          if [[ "$TARGET" == ios ]]; then
            if [[ ! -f ios/Podfile ]]; then
              cp "$FLUTTER_ROOT/packages/flutter_tools/templates/cocoapods/Podfile-ios" ios/Podfile
            fi
            sed -i '' -E "s/^#?[[:space:]]*platform :ios, '(1[0-3])(\.[0-9]+)*'/platform :ios, '14.0'/" ios/Podfile
            sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = 1[0-3]\.[0-9]+;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/Runner.xcodeproj/project.pbxproj
          elif [[ "$TARGET" == macos ]]; then
            if [[ ! -f macos/Podfile ]]; then
              cp "$FLUTTER_ROOT/packages/flutter_tools/templates/cocoapods/Podfile-macos" macos/Podfile
            fi
            sed -i '' -E "s/^#?[[:space:]]*platform :osx, '10\.[0-9]+'/platform :osx, '11.0'/" macos/Podfile
            sed -i '' -E 's/MACOSX_DEPLOYMENT_TARGET = 10\.[0-9]+;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' macos/Runner.xcodeproj/project.pbxproj
          fi

      - name: Build the packaged app
        working-directory: example
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            android)
              flutter build apk --release --target-platform android-arm64
              apk=build/app/outputs/flutter-apk/app-release.apk
              unzip -p "$apk" lib/arm64-v8a/libzvec_c_api.so > "$RUNNER_TEMP/libzvec_c_api.so"
              file "$RUNNER_TEMP/libzvec_c_api.so" | grep -E 'ELF.*aarch64'
              zipalign=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
              "$zipalign" -c -P 16 4 "$apk"
              ;;
            ios)
              flutter build ios --release --no-codesign
              test -s build/ios/iphoneos/Runner.app/Frameworks/zvec_native.framework/zvec_native
              flutter build ios --simulator --debug --dart-define=ZVEC_RELEASE_SMOKE=true
              app=build/ios/iphonesimulator/Runner.app
              test -s "$app/Frameworks/zvec_native.framework/zvec_native"
              devices="$RUNNER_TEMP/zvec-simulators.json"
              xcrun simctl list devices available -j > "$devices"
              simulator=$(jq -er '[.devices | to_entries[] | select(.key | contains(".iOS-")) | .value[] | select(.name | startswith("iPhone"))][0].udid' "$devices")
              xcrun simctl bootstatus "$simulator" -b
              xcrun simctl install "$simulator" "$app"
              bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
              xcrun simctl launch --console "$simulator" "$bundle" | tee "$RUNNER_TEMP/zvec-simulator.log"
              grep -F 'zvec release smoke test passed' "$RUNNER_TEMP/zvec-simulator.log"
              ;;
            *) flutter build "$TARGET" --release --dart-define=ZVEC_RELEASE_SMOKE=true ;;
          esac
      - name: Run packaged desktop app
        if: matrix.sdk
        working-directory: example
        env:
          TARGET: ${{ matrix.target }}
        run: |
          unset ZVEC_LIBRARY_PATH
          case "$TARGET" in
            linux) xvfb-run -a build/linux/*/release/bundle/zvec_example ;;
            macos) build/macos/Build/Products/Release/zvec_example.app/Contents/MacOS/zvec_example ;;
            windows) build/windows/x64/runner/Release/zvec_example.exe ;;
          esac

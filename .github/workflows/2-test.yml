# =============================================================================
# Test Workflow — Run Dart unit tests on every push to main
#
# Runs pure-Dart tests, native FFI tests, desktop build smoke tests, and pub
# package/consumer smoke tests.
# =============================================================================
name: "Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Pure-Dart unit tests (no native library needed)
  # =========================================================================
  dart-tests:
    name: Dart unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run pure-Dart tests
        run: flutter test test/zvec_test.dart

  # =========================================================================
  # Native FFI tests (requires building libzvec.dylib on macOS)
  # =========================================================================
  native-tests:
    name: Native FFI tests
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Get submodule hash for cache key
        id: zvec-hash
        run: echo "hash=$(git submodule status third_party/zvec | awk '{print $1}' | tr -d '-')" >> $GITHUB_OUTPUT

      - name: Cache native build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: build/macos
          key: native-macos-${{ runner.arch }}-${{ steps.zvec-hash.outputs.hash }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_macos.sh Release

      - name: Run native FFI tests
        run: bash scripts/run_tests.sh test/zvec_native_test.dart

  # =========================================================================
  # Android native build (validates the published minSdk native ABI)
  # =========================================================================
  android-native-build:
    name: Android native build
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build Android arm64-v8a API 21
        run: bash scripts/build_android.sh arm64-v8a 21 Release

      - name: Verify Android artifact
        run: file android/src/main/jniLibs/arm64-v8a/libzvec.so

  # =========================================================================
  # Desktop native + Flutter app build smoke tests
  # =========================================================================
  desktop-macos-build:
    name: Desktop macOS build
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build macOS native library
        run: bash scripts/build_macos.sh Release

      - name: Verify macOS native artifact
        run: file macos/zvec.framework/zvec

      - name: Generate macOS example platform files
        working-directory: example
        run: flutter create --platforms=macos .

      - name: Build macOS example app
        working-directory: example
        run: flutter build macos --debug

  desktop-linux-build:
    name: Desktop Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libaio-dev \
            libgtk-3-dev \
            ninja-build \
            pkg-config \
            zip

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Linux native library
        run: bash scripts/build_linux.sh Release

      - name: Verify Linux native artifact
        run: file linux/lib/libzvec.so

      - name: Generate Linux example platform files
        working-directory: example
        run: flutter create --platforms=linux .

      - name: Build Linux example app
        working-directory: example
        run: flutter build linux --debug

  desktop-windows-build:
    name: Desktop Windows build
    runs-on: windows-2022
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Windows native library
        shell: powershell
        run: .\scripts\build_windows.ps1 -BuildType Release

      - name: Verify Windows native artifact
        shell: powershell
        run: Get-Item windows\lib\zvec.dll

      - name: Generate Windows example platform files
        working-directory: example
        run: flutter create --platforms=windows .

      - name: Build Windows example app
        working-directory: example
        run: flutter build windows --debug

  # =========================================================================
  # Package dry-run and example integration test
  # =========================================================================
  package-tests:
    name: Package dry run and example integration
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Get submodule hash for cache key
        id: zvec-hash
        run: echo "hash=$(git submodule status third_party/zvec | awk '{print $1}' | tr -d '-')" >> $GITHUB_OUTPUT

      - name: Cache native build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: build/macos
          key: native-macos-${{ runner.arch }}-${{ steps.zvec-hash.outputs.hash }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Jieba dictionary assets
        run: bash scripts/prepare_jieba_assets.sh

      - name: Remove submodule gitlink for pub validation
        run: |
          # Workaround for dart pub bug (dart-lang/pub#3789):
          # pub incorrectly warns about submodule gitlink entries being gitignored.
          git rm --cached third_party/zvec

      - name: Dry-run pub package
        run: dart pub publish --dry-run

      - name: Build macOS native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_macos.sh Release

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run example Jieba FTS integration test
        working-directory: example
        env:
          ZVEC_LIBRARY_PATH: ${{ github.workspace }}/build/macos/libzvec.dylib
        run: flutter test test/jieba_fts_integration_test.dart

      - name: Build example asset bundle and verify package assets
        working-directory: example
        run: |
          flutter build bundle --debug
          for file in jieba.dict.utf8 hmm_model.utf8; do
            asset="build/flutter_assets/packages/zvec/assets/jieba_dict/$file"
            if [ ! -s "$asset" ]; then
              echo "::error::Missing packaged Jieba asset: $asset"
              exit 1
            fi
            ls -lh "$asset"
          done

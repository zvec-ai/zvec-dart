# =============================================================================
# Workflow: Build Native Libraries, Create GitHub Release & Publish to pub.dev
#
# Triggered by pushing a version tag (e.g. v0.1.0). Compiles native
# libraries for all platforms, packages them as zip files, uploads
# to GitHub Releases, and publishes the Dart package to pub.dev.
#
# A manual workflow_dispatch run is a safe dry run. It builds the same native
# artifacts, validates the package with `dart pub publish --dry-run`, and
# verifies example apps from local artifacts without creating a GitHub Release
# or publishing to pub.dev.
#
# Prerequisites:
#   - pubspec.yaml version matches the tag (e.g. tag v0.1.0 → version: 0.1.0)
#   - CHANGELOG.md mentions the version
#   - pub.dev: Enable automated publishing from GitHub Actions
#     (Repository: zvec-ai/zvec-dart, Tag pattern: v{{version}})
#
# Trigger: git tag v0.1.0 && git push origin v0.1.0
# =============================================================================
name: "Build, Release & Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to dry-run verify, e.g. v0.6.0. Must match pubspec.yaml and native package versions."
        required: true
        type: string

env:
  # Extract version from tag: v0.1.0 → 0.1.0
  ZVEC_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  # =========================================================================
  # Build Android — runs in parallel with iOS
  #
  # NOTE: armeabi-v7a is currently disabled. Upstream zvec cmake
  # (cmake/option.cmake _setup_armv8_march) unconditionally appends
  # -march=armv8 to CFLAGS, which conflicts with the NDK's -march=armv7-a
  # for 32-bit ARM targets, causing lz4 and other thirdparty builds to fail.
  # Re-enable when upstream fixes arch flag handling for armv7.
  # =========================================================================
  build-android:
    name: Build Android
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Verify version consistency
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          # Strip 'v' prefix from tag: v0.1.0 → 0.1.0
          TAG_VERSION="${ZVEC_VERSION#v}"
          echo "pubspec.yaml version: $PUBSPEC_VERSION"
          echo "Tag version:          $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! pubspec.yaml=$PUBSPEC_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Verify native package versions
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import pathlib
          import re
          import sys

          expected = "${TAG_VERSION}"
          checks = [
              ("android/build.gradle", r'def ZVEC_VERSION = "([^"]+)"'),
              ("ios/zvec.podspec", r"s\\.version\\s*=\\s*'([^']+)'"),
              ("macos/zvec.podspec", r"s\\.version\\s*=\\s*'([^']+)'"),
              ("linux/CMakeLists.txt", r'set\\(ZVEC_VERSION "([^"]+)"\\)'),
              ("windows/CMakeLists.txt", r'set\\(ZVEC_VERSION "([^"]+)"\\)'),
          ]
          failed = False
          for path, pattern in checks:
              text = pathlib.Path(path).read_text()
              match = re.search(pattern, text)
              actual = match.group(1) if match else None
              print(f"{path}: {actual}")
              if actual != expected:
                  print(f"::error::{path} version {actual!r} != tag {expected!r}")
                  failed = True
          if failed:
              sys.exit(1)
          PYEOF

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build Android arm64-v8a
        run: bash scripts/build_android.sh arm64-v8a 21 Release

      - name: Verify Android artifacts
        run: |
          file android/src/main/jniLibs/arm64-v8a/libzvec.so
          ls -lh build/release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: build/release/libzvec-android-arm64-v8a.zip

  # =========================================================================
  # Build iOS (arm64 device) — runs in parallel with Android/Desktop
  # =========================================================================
  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Build iOS arm64
        run: bash scripts/build_ios.sh OS Release

      - name: Verify iOS artifacts
        run: |
          file ios/zvec.framework/zvec
          ls -lh build/release/

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-libs
          path: build/release/zvec-framework-ios.zip

  # =========================================================================
  # Build macOS desktop framework
  # =========================================================================
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Build macOS arm64
        run: bash scripts/build_macos.sh Release

      - name: Verify macOS artifacts
        run: |
          file macos/zvec_native.framework/zvec_native
          ls -lh build/release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-libs
          path: build/release/zvec-framework-macos-arm64.zip

  # =========================================================================
  # Build Linux desktop library
  # =========================================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libaio-dev zip

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Build Linux x64
        run: bash scripts/build_linux.sh Release

      - name: Verify Linux artifacts
        run: |
          file linux/lib/libzvec.so
          ls -lh build/release/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-libs
          path: build/release/libzvec-linux-x64.zip

  # =========================================================================
  # Build Windows desktop library
  # =========================================================================
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build Windows x64
        shell: powershell
        run: .\scripts\build_windows.ps1 -BuildType Release

      - name: Verify Windows artifacts
        shell: powershell
        run: |
          Get-Item windows\lib\zvec.dll
          Get-ChildItem build\release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-libs
          path: build/release/libzvec-windows-x64.zip

  # =========================================================================
  # Manual package dry run — validates pub package contents without publishing
  # =========================================================================
  package-dry-run:
    name: Package dry run (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify version consistency
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${ZVEC_VERSION#v}"
          echo "pubspec.yaml version: $PUBSPEC_VERSION"
          echo "Dry-run version:      $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! pubspec.yaml=$PUBSPEC_VERSION, dry-run=$TAG_VERSION"
            exit 1
          fi

      - name: Prepare Jieba dictionary assets
        run: bash scripts/prepare_jieba_assets.sh

      - name: Remove submodule gitlink for pub validation
        run: |
          # Workaround for dart pub bug (dart-lang/pub#3789):
          # pub incorrectly warns about submodule gitlink entries being gitignored.
          git rm --cached third_party/zvec

      - name: Dry run
        run: dart pub publish --dry-run

  # =========================================================================
  # Create GitHub Release — waits for all native builds to succeed
  # =========================================================================
  release:
    name: Create GitHub Release
    if: ${{ github.event_name == 'push' }}
    needs: [build-android, build-ios, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Verify all artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release_notes.md << 'EOF'
          ## Prebuilt native libraries

          | Platform | ABI | File |
          |----------|-----|------|
          | Android | arm64-v8a | libzvec-android-arm64-v8a.zip |
          | iOS | arm64 | zvec-framework-ios.zip |
          | macOS | arm64 | zvec-framework-macos-arm64.zip |
          | Linux | x64 | libzvec-linux-x64.zip |
          | Windows | x64 | libzvec-windows-x64.zip |

          These binaries are automatically downloaded during `flutter build`.
          EOF

          gh release create "${ZVEC_VERSION}" \
            artifacts/libzvec-android-arm64-v8a.zip \
            artifacts/zvec-framework-ios.zip \
            artifacts/zvec-framework-macos-arm64.zip \
            artifacts/libzvec-linux-x64.zip \
            artifacts/libzvec-windows-x64.zip \
            --repo "${{ github.repository }}" \
            --title "${ZVEC_VERSION}" \
            --notes-file /tmp/release_notes.md

  # =========================================================================
  # Publish to pub.dev — after GitHub Release is created
  #
  # Uses OIDC trusted publishing (dart-lang/setup-dart) on version tag pushes.
  # =========================================================================
  publish:
    name: Publish to pub.dev
    if: ${{ github.event_name == 'push' }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication with pub.dev
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Dart (for OIDC publishing)
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify version consistency
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${ZVEC_VERSION#v}"
          echo "pubspec.yaml version: $PUBSPEC_VERSION"
          echo "Tag version:          $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! pubspec.yaml=$PUBSPEC_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Prepare Jieba dictionary assets
        run: bash scripts/prepare_jieba_assets.sh

      - name: Remove submodule gitlink for pub validation
        run: |
          # Workaround for dart pub bug (dart-lang/pub#3789):
          # pub incorrectly warns about submodule gitlink entries being gitignored.
          git rm --cached third_party/zvec

      - name: Dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force

  # =========================================================================
  # Gate release verification for either a real release or a manual dry run
  # =========================================================================
  release-gate:
    name: Release verification gate
    needs: [package-dry-run, publish]
    if: ${{ always() && ((github.event_name == 'push' && needs['publish'].result == 'success') || (github.event_name == 'workflow_dispatch' && needs['package-dry-run'].result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm verification mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dry-run release verification for ${ZVEC_VERSION}"
            echo "No GitHub Release or pub.dev publish was performed."
          else
            echo "Published release ${ZVEC_VERSION}; starting post-publish verification."
          fi

  # =========================================================================
  # Verify package install/build/test behavior
  #
  # On tag pushes, waits for pub.dev indexing and verifies the published package.
  # On manual dry runs, installs this workflow's native artifacts into the local
  # package checkout and verifies the example app via its path dependency.
  #
  # Verifies:
  #   - Android APK bundles native library and Jieba assets
  #   - iOS app bundles zvec.framework and Jieba assets
  #   - Desktop apps bundle the release native artifact and can execute FFI calls
  # =========================================================================
  verify-android:
    name: Verify Android (APK static check)
    needs: [build-android, release-gate]
    if: ${{ always() && needs['build-android'].result == 'success' && needs['release-gate'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for example app)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare local package assets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/prepare_jieba_assets.sh

      - name: Download Android release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-v8a
          path: /tmp/zvec-artifacts

      - name: Install Android release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p android/src/main/jniLibs/arm64-v8a
          unzip -o /tmp/zvec-artifacts/libzvec-android-arm64-v8a.zip \
            -d android/src/main/jniLibs/arm64-v8a
          file android/src/main/jniLibs/arm64-v8a/libzvec.so

      - name: Resolve local example dependency
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: example
        run: flutter pub get

      - name: Switch example to pub.dev dependency
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          txt = p.read_text()
          txt, count = re.subn(
              r'zvec:\n(\s+#[^\n]*\n)*\s+path: \.\./\n',
              'zvec: ${TAG_VERSION}\n',
              txt
          )
          if count != 1:
              raise SystemExit('Failed to replace zvec path dependency')
          p.write_text(txt)
          PYEOF
          echo "Updated pubspec.yaml:"
          grep -A2 'zvec:' pubspec.yaml

      - name: Wait for pub.dev indexing and resolve
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: waiting 60s for pub.dev indexing..."
            sleep 60
            if flutter pub get; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "::error::Failed to resolve package after 6 attempts"
          exit 1

      - name: Build APK
        working-directory: example
        run: flutter build apk --debug

      - name: Verify APK contents
        working-directory: example
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          echo "=== APK size ==="
          ls -lh "$APK"
          echo ""
          echo "=== Native libraries in APK ==="
          unzip -l "$APK" | grep '\.so$'
          echo ""
          echo "=== Verify libzvec.so for arm64-v8a ==="
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libzvec.so"; then
            unzip -o -j "$APK" "lib/arm64-v8a/libzvec.so" -d /tmp/verify_arm64
            FILE_INFO=$(file /tmp/verify_arm64/libzvec.so)
            echo "arm64-v8a/libzvec.so — $FILE_INFO"
            if echo "$FILE_INFO" | grep -q "ELF.*shared object"; then
              echo "Format: valid ELF shared object"
            else
              echo "::error::Unexpected format for libzvec.so"
              exit 1
            fi
          else
            echo "::error::lib/arm64-v8a/libzvec.so NOT FOUND in APK"
            exit 1
          fi
          echo ""
          echo "=== Verify packaged Jieba assets ==="
          for file in jieba.dict.utf8 hmm_model.utf8; do
            asset="assets/flutter_assets/packages/zvec/assets/jieba_dict/$file"
            if unzip -l "$APK" | grep -q "$asset"; then
              unzip -l "$APK" | grep "$asset"
            else
              echo "::error::Missing packaged Jieba asset in APK: $asset"
              exit 1
            fi
          done

  verify-ios:
    name: Verify iOS (device build, no codesign)
    needs: [build-ios, release-gate]
    if: ${{ always() && needs['build-ios'].result == 'success' && needs['release-gate'].result == 'success' }}
    runs-on: macos-14
    steps:
      - name: Checkout (for example app)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare local package assets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/prepare_jieba_assets.sh

      - name: Download iOS release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-libs
          path: /tmp/zvec-artifacts

      - name: Install iOS release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          rm -rf ios/zvec.framework
          unzip -o /tmp/zvec-artifacts/zvec-framework-ios.zip -d ios
          file ios/zvec.framework/zvec

      - name: Resolve local example dependency
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: example
        run: flutter pub get

      - name: Switch example to pub.dev dependency
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          txt = p.read_text()
          txt, count = re.subn(
              r'zvec:\n(\s+#[^\n]*\n)*\s+path: \.\./\n',
              'zvec: ${TAG_VERSION}\n',
              txt
          )
          if count != 1:
              raise SystemExit('Failed to replace zvec path dependency')
          p.write_text(txt)
          PYEOF
          echo "Updated pubspec.yaml:"
          grep -A2 'zvec:' pubspec.yaml

      - name: Wait for pub.dev indexing and resolve
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: waiting 60s for pub.dev indexing..."
            sleep 60
            if flutter pub get; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "::error::Failed to resolve package after 6 attempts"
          exit 1

      - name: Generate iOS platform files
        working-directory: example
        run: |
          flutter create --platforms=ios .
          # zvec requires iOS 14.0+ — uncomment and set platform line
          sed -i '' "s/^# *platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          grep 'platform :ios' ios/Podfile

      - name: Build iOS (device, no codesign)
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Verify zvec.framework
        working-directory: example
        run: |
          echo "=== Searching for zvec.framework ==="
          FRAMEWORK=$(find build -name "zvec.framework" -type d | head -1)
          if [ -z "$FRAMEWORK" ]; then
            echo "::error::zvec.framework NOT found in build output"
            exit 1
          fi
          echo "Found: $FRAMEWORK"
          BINARY="$FRAMEWORK/zvec"
          echo ""
          echo "=== Architecture check ==="
          lipo -info "$BINARY"
          if lipo -info "$BINARY" | grep -q "arm64"; then
            echo "arm64 architecture confirmed"
          else
            echo "::error::arm64 architecture NOT found in zvec.framework"
            exit 1
          fi

      - name: Verify packaged Jieba assets
        working-directory: example
        run: |
          for file in jieba.dict.utf8 hmm_model.utf8; do
            asset=$(find build/ios -path "*/flutter_assets/packages/zvec/assets/jieba_dict/$file" -type f | head -1)
            if [ -z "$asset" ] || [ ! -s "$asset" ]; then
              echo "::error::Missing packaged Jieba asset in iOS build: $file"
              exit 1
            fi
            ls -lh "$asset"
          done

  verify-macos:
    name: Verify macOS (desktop build)
    needs: [build-macos, release-gate]
    if: ${{ always() && needs['build-macos'].result == 'success' && needs['release-gate'].result == 'success' }}
    runs-on: macos-14
    steps:
      - name: Checkout (for example app)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare local package assets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/prepare_jieba_assets.sh

      - name: Download macOS release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-libs
          path: /tmp/zvec-artifacts

      - name: Install macOS release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          rm -rf macos/zvec_native.framework
          unzip -o /tmp/zvec-artifacts/zvec-framework-macos-arm64.zip -d macos
          file macos/zvec_native.framework/zvec_native

      - name: Resolve local example dependency
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: example
        run: flutter pub get

      - name: Switch example to pub.dev dependency
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          txt = p.read_text()
          txt, count = re.subn(
              r'zvec:\n(\s+#[^\n]*\n)*\s+path: \.\./\n',
              'zvec: ${TAG_VERSION}\n',
              txt
          )
          if count != 1:
              raise SystemExit('Failed to replace zvec path dependency')
          p.write_text(txt)
          PYEOF
          grep -A2 'zvec:' pubspec.yaml

      - name: Wait for pub.dev indexing and resolve
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: waiting 60s for pub.dev indexing..."
            sleep 60
            if flutter pub get; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "::error::Failed to resolve package after 6 attempts"
          exit 1

      - name: Generate macOS platform files
        working-directory: example
        run: flutter create --platforms=macos .

      - name: Build macOS release app
        working-directory: example
        run: flutter build macos --release --dart-define=ZVEC_RELEASE_SMOKE=true

      - name: Verify zvec_native.framework
        working-directory: example
        run: |
          APP="build/macos/Build/Products/Release/zvec_example.app"
          FRAMEWORK="$APP/Contents/Frameworks/zvec_native.framework"
          BINARY="$FRAMEWORK/zvec_native"
          if [ ! -d "$FRAMEWORK" ] || [ ! -s "$BINARY" ]; then
            echo "::error::zvec_native.framework NOT found in macOS release app bundle"
            exit 1
          fi
          lipo -info "$BINARY"
          if ! lipo -info "$BINARY" | grep -q "arm64"; then
            echo "::error::arm64 architecture NOT found in zvec_native.framework"
            exit 1
          fi

      - name: Verify packaged Jieba assets
        working-directory: example
        run: |
          ASSETS="build/macos/Build/Products/Release/zvec_example.app/Contents/Frameworks/App.framework/Resources/flutter_assets/packages/zvec/assets/jieba_dict"
          for file in jieba.dict.utf8 hmm_model.utf8; do
            if [ ! -s "$ASSETS/$file" ]; then
              echo "::error::Missing packaged Jieba asset in macOS release app: $file"
              exit 1
            fi
            ls -lh "$ASSETS/$file"
          done

      - name: Run macOS release app smoke test
        working-directory: example
        run: |
          unset ZVEC_LIBRARY_PATH
          "build/macos/Build/Products/Release/zvec_example.app/Contents/MacOS/zvec_example"

  verify-linux:
    name: Verify Linux (desktop build)
    needs: [build-linux, release-gate]
    if: ${{ always() && needs['build-linux'].result == 'success' && needs['release-gate'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for example app)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libgtk-3-dev \
            ninja-build \
            pkg-config \
            unzip \
            xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare local package assets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/prepare_jieba_assets.sh

      - name: Download Linux release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-libs
          path: /tmp/zvec-artifacts

      - name: Install Linux release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p linux/lib
          unzip -o /tmp/zvec-artifacts/libzvec-linux-x64.zip -d linux/lib
          file linux/lib/libzvec.so

      - name: Resolve local example dependency
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: example
        run: flutter pub get

      - name: Switch example to pub.dev dependency
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          txt = p.read_text()
          txt, count = re.subn(
              r'zvec:\n(\s+#[^\n]*\n)*\s+path: \.\./\n',
              'zvec: ${TAG_VERSION}\n',
              txt
          )
          if count != 1:
              raise SystemExit('Failed to replace zvec path dependency')
          p.write_text(txt)
          PYEOF
          grep -A2 'zvec:' pubspec.yaml

      - name: Wait for pub.dev indexing and resolve
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: waiting 60s for pub.dev indexing..."
            sleep 60
            if flutter pub get; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "::error::Failed to resolve package after 6 attempts"
          exit 1

      - name: Generate Linux platform files
        working-directory: example
        run: flutter create --platforms=linux .

      - name: Build Linux release app
        working-directory: example
        run: flutter build linux --release --dart-define=ZVEC_RELEASE_SMOKE=true

      - name: Verify libzvec.so
        working-directory: example
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          LIB="$BUNDLE/lib/libzvec.so"
          if [ ! -s "$LIB" ]; then
            echo "::error::libzvec.so NOT found in Linux release bundle"
            exit 1
          fi
          file "$LIB"
          if ! file "$LIB" | grep -q "ELF.*shared object"; then
            echo "::error::Unexpected format for libzvec.so"
            exit 1
          fi
          if ! file "$LIB" | grep -q "x86-64"; then
            echo "::error::Expected x86-64 libzvec.so"
            exit 1
          fi

      - name: Verify packaged Jieba assets
        working-directory: example
        run: |
          ASSETS="build/linux/x64/release/bundle/data/flutter_assets/packages/zvec/assets/jieba_dict"
          for file in jieba.dict.utf8 hmm_model.utf8; do
            if [ ! -s "$ASSETS/$file" ]; then
              echo "::error::Missing packaged Jieba asset in Linux release bundle: $file"
              exit 1
            fi
            ls -lh "$ASSETS/$file"
          done

      - name: Run Linux release app smoke test
        working-directory: example
        run: |
          unset ZVEC_LIBRARY_PATH
          xvfb-run -a build/linux/x64/release/bundle/zvec_example

  verify-windows:
    name: Verify Windows (desktop build)
    needs: [build-windows, release-gate]
    if: ${{ always() && needs['build-windows'].result == 'success' && needs['release-gate'].result == 'success' }}
    runs-on: windows-2022
    steps:
      - name: Checkout (for example app)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare local package assets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: bash scripts/prepare_jieba_assets.sh

      - name: Download Windows release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-libs
          path: zvec-artifacts

      - name: Install Windows release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "windows\lib" | Out-Null
          Expand-Archive -Path "zvec-artifacts\libzvec-windows-x64.zip" `
            -DestinationPath "windows\lib" `
            -Force
          Get-Item "windows\lib\zvec.dll"

      - name: Resolve local example dependency
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: example
        run: flutter pub get

      - name: Switch example to pub.dev dependency
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        shell: powershell
        run: |
          $tagVersion = "${env:ZVEC_VERSION}".TrimStart("v")
          $pubspec = "pubspec.yaml"
          $text = Get-Content $pubspec -Raw
          $regex = [regex]::new("zvec:\r?\n(\s+#[^\r\n]*\r?\n)*\s+path: \.\./\r?\n")
          $updated = $regex.Replace($text, "zvec: $tagVersion`n", 1)
          if ($updated -eq $text) {
            throw "Failed to replace zvec path dependency"
          }
          Set-Content -Path $pubspec -Value $updated -Encoding UTF8
          Select-String -Path $pubspec -Pattern "zvec:" -Context 0,2

      - name: Wait for pub.dev indexing and resolve
        if: ${{ github.event_name == 'push' }}
        working-directory: example
        shell: powershell
        run: |
          for ($i = 1; $i -le 6; $i++) {
            Write-Host "Attempt ${i}: waiting 60s for pub.dev indexing..."
            Start-Sleep -Seconds 60
            flutter pub get
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Success on attempt $i"
              exit 0
            }
            Write-Host "Attempt $i failed, retrying..."
          }
          throw "Failed to resolve package after 6 attempts"

      - name: Generate Windows platform files
        working-directory: example
        run: flutter create --platforms=windows .

      - name: Build Windows release app
        working-directory: example
        run: flutter build windows --release --dart-define=ZVEC_RELEASE_SMOKE=true

      - name: Verify zvec.dll
        working-directory: example
        shell: powershell
        run: |
          $bundle = "build\windows\x64\runner\Release"
          $dll = Join-Path $bundle "zvec.dll"
          if (-not (Test-Path $dll -PathType Leaf)) {
            throw "zvec.dll NOT found in Windows release bundle"
          }
          Get-Item $dll

      - name: Verify packaged Jieba assets
        working-directory: example
        shell: powershell
        run: |
          $assets = "build\windows\x64\runner\Release\data\flutter_assets\packages\zvec\assets\jieba_dict"
          foreach ($file in @("jieba.dict.utf8", "hmm_model.utf8")) {
            $asset = Join-Path $assets $file
            if (-not (Test-Path $asset -PathType Leaf) -or (Get-Item $asset).Length -le 0) {
              throw "Missing packaged Jieba asset in Windows release bundle: $file"
            }
            Get-Item $asset
          }

      - name: Run Windows release app smoke test
        working-directory: example
        shell: powershell
        run: |
          if ($env:ZVEC_LIBRARY_PATH) {
            Remove-Item Env:\ZVEC_LIBRARY_PATH
          }
          & "build\windows\x64\runner\Release\zvec_example.exe"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  verify-summary:
    name: Verification summary
    needs: [verify-android, verify-ios, verify-macos, verify-linux, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "============================================"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "  Package ${ZVEC_VERSION} dry-run verified from local workflow artifacts!"
          else
            echo "  Package ${ZVEC_VERSION} fully verified after publishing!"
          fi
          echo ""
          echo "  Android: APK contains arm64-v8a libzvec.so and Jieba assets"
          echo "  iOS:     zvec.framework present with arm64 architecture and Jieba assets"
          echo "  macOS:   release app bundles zvec_native.framework/Jieba assets and runs FFI smoke test"
          echo "  Linux:   release app bundles libzvec.so/Jieba assets and runs FFI smoke test"
          echo "  Windows: release app bundles zvec.dll/Jieba assets and runs FFI smoke test"
          echo "============================================"

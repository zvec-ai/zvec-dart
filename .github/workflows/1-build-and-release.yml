# =============================================================================
# Workflow: Build Native Libraries, Create GitHub Release & Publish to pub.dev
#
# Triggered by pushing a version tag (e.g. v0.1.0). Compiles native
# libraries for all platforms, packages them as zip files, uploads
# to GitHub Releases, and publishes the Dart package to pub.dev.
#
# Prerequisites:
#   - pubspec.yaml version matches the tag (e.g. tag v0.1.0 → version: 0.1.0)
#   - CHANGELOG.md mentions the version
#   - pub.dev: Enable automated publishing from GitHub Actions
#     (Repository: zvec-ai/zvec-dart, Tag pattern: v{{version}})
#
# Trigger: git tag v0.1.0 && git push origin v0.1.0
# =============================================================================
name: "Build, Release & Publish"

on:
  push:
    tags:
      - 'v*'

env:
  # Extract version from tag: v0.1.0 → 0.1.0
  ZVEC_VERSION: ${{ github.ref_name }}

jobs:
  # =========================================================================
  # Build Android — runs in parallel with iOS
  #
  # NOTE: armeabi-v7a is currently disabled. Upstream zvec cmake
  # (cmake/option.cmake _setup_armv8_march) unconditionally appends
  # -march=armv8 to CFLAGS, which conflicts with the NDK's -march=armv7-a
  # for 32-bit ARM targets, causing lz4 and other thirdparty builds to fail.
  # Re-enable when upstream fixes arch flag handling for armv7.
  # =========================================================================
  build-android:
    name: Build Android
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Verify version consistency
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          # Strip 'v' prefix from tag: v0.1.0 → 0.1.0
          TAG_VERSION="${ZVEC_VERSION#v}"
          echo "pubspec.yaml version: $PUBSPEC_VERSION"
          echo "Tag version:          $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! pubspec.yaml=$PUBSPEC_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build Android arm64-v8a
        run: bash scripts/build_android.sh arm64-v8a 21 Release

      - name: Verify Android artifacts
        run: |
          file android/src/main/jniLibs/arm64-v8a/libzvec.so
          ls -lh build/release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: build/release/libzvec-android-arm64-v8a.zip

  # =========================================================================
  # Build iOS (arm64 device) — runs in parallel with Android
  # =========================================================================
  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule tags
        run: cd third_party/zvec && git fetch --tags

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Build iOS arm64
        run: bash scripts/build_ios.sh OS Release

      - name: Verify iOS artifacts
        run: |
          file ios/zvec.framework/zvec
          ls -lh build/release/

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-libs
          path: build/release/zvec-framework-ios.zip

  # =========================================================================
  # Create GitHub Release — waits for both builds to succeed
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Verify all artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release_notes.md << 'EOF'
          ## Prebuilt native libraries

          | Platform | ABI | File |
          |----------|-----|------|
          | Android | arm64-v8a | libzvec-android-arm64-v8a.zip |
          | iOS | arm64 | zvec-framework-ios.zip |

          These binaries are automatically downloaded during `flutter build`.
          EOF

          gh release create "${ZVEC_VERSION}" \
            artifacts/libzvec-android-arm64-v8a.zip \
            artifacts/zvec-framework-ios.zip \
            --repo "${{ github.repository }}" \
            --title "${ZVEC_VERSION}" \
            --notes-file /tmp/release_notes.md

  # =========================================================================
  # Publish to pub.dev — after GitHub Release is created
  #
  # Uses OIDC trusted publishing (dart-lang/setup-dart) which requires
  # the workflow to run on a 'push' or 'workflow_dispatch' event.
  # =========================================================================
  publish:
    name: Publish to pub.dev
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication with pub.dev
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Dart (for OIDC publishing)
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify version consistency
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${ZVEC_VERSION#v}"
          echo "pubspec.yaml version: $PUBSPEC_VERSION"
          echo "Tag version:          $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! pubspec.yaml=$PUBSPEC_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Prepare Jieba dictionary assets
        run: bash scripts/prepare_jieba_assets.sh

      - name: Remove submodule gitlink for pub validation
        run: |
          # Workaround for dart pub bug (dart-lang/pub#3789):
          # pub incorrectly warns about submodule gitlink entries being gitignored.
          git rm --cached third_party/zvec

      - name: Dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force

  # =========================================================================
  # Verify published package — install from pub.dev and build/test example app
  #
  # Waits for pub.dev indexing, then verifies:
  #   - macOS host functional Jieba FTS integration
  #   - Android APK bundles native library and Jieba assets
  #   - iOS app bundles zvec.framework and Jieba assets
  # =========================================================================
  verify-android:
    name: Verify Android (APK static check)
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for example app)
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Switch example to pub.dev dependency
        working-directory: example
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          txt = p.read_text()
          txt, count = re.subn(
              r'zvec:\n(\s+#[^\n]*\n)*\s+path: \.\./\n',
              'zvec: ${TAG_VERSION}\n',
              txt
          )
          if count != 1:
              raise SystemExit('Failed to replace zvec path dependency')
          p.write_text(txt)
          PYEOF
          echo "Updated pubspec.yaml:"
          grep -A2 'zvec:' pubspec.yaml

      - name: Wait for pub.dev indexing and resolve
        working-directory: example
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: waiting 60s for pub.dev indexing..."
            sleep 60
            if flutter pub get; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "::error::Failed to resolve package after 6 attempts"
          exit 1

      - name: Build APK
        working-directory: example
        run: flutter build apk --debug

      - name: Verify APK contents
        working-directory: example
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          echo "=== APK size ==="
          ls -lh "$APK"
          echo ""
          echo "=== Native libraries in APK ==="
          unzip -l "$APK" | grep '\.so$'
          echo ""
          echo "=== Verify libzvec.so for arm64-v8a ==="
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libzvec.so"; then
            unzip -o -j "$APK" "lib/arm64-v8a/libzvec.so" -d /tmp/verify_arm64
            FILE_INFO=$(file /tmp/verify_arm64/libzvec.so)
            echo "arm64-v8a/libzvec.so — $FILE_INFO"
            if echo "$FILE_INFO" | grep -q "ELF.*shared object"; then
              echo "Format: valid ELF shared object"
            else
              echo "::error::Unexpected format for libzvec.so"
              exit 1
            fi
          else
            echo "::error::lib/arm64-v8a/libzvec.so NOT FOUND in APK"
            exit 1
          fi
          echo ""
          echo "=== Verify packaged Jieba assets ==="
          for file in jieba.dict.utf8 hmm_model.utf8; do
            asset="assets/flutter_assets/packages/zvec/assets/jieba_dict/$file"
            if unzip -l "$APK" | grep -q "$asset"; then
              unzip -l "$APK" | grep "$asset"
            else
              echo "::error::Missing packaged Jieba asset in APK: $asset"
              exit 1
            fi
          done

  verify-macos-functional:
    name: Verify macOS (pub.dev functional test)
    needs: [publish]
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build macOS native library for host test
        run: bash scripts/build_macos.sh Release

      - name: Switch example to pub.dev dependency
        working-directory: example
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          txt = p.read_text()
          txt, count = re.subn(
              r'zvec:\n(\s+#[^\n]*\n)*\s+path: \.\./\n',
              'zvec: ${TAG_VERSION}\n',
              txt
          )
          if count != 1:
              raise SystemExit('Failed to replace zvec path dependency')
          p.write_text(txt)
          PYEOF
          echo "Updated pubspec.yaml:"
          grep -A2 'zvec:' pubspec.yaml

      - name: Wait for pub.dev indexing and resolve
        working-directory: example
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: waiting 60s for pub.dev indexing..."
            sleep 60
            if flutter pub get; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "::error::Failed to resolve package after 6 attempts"
          exit 1

      - name: Run published package Jieba FTS integration test
        working-directory: example
        env:
          ZVEC_LIBRARY_PATH: ${{ github.workspace }}/build/macos/libzvec.dylib
          TMPDIR: ${{ github.workspace }}/tmp
        run: |
          mkdir -p "$TMPDIR"
          flutter test test/jieba_fts_integration_test.dart

  verify-ios:
    name: Verify iOS (device build, no codesign)
    needs: [publish]
    runs-on: macos-14
    steps:
      - name: Checkout (for example app)
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Switch example to pub.dev dependency
        working-directory: example
        run: |
          TAG_VERSION="${ZVEC_VERSION#v}"
          python3 - << PYEOF
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          txt = p.read_text()
          txt, count = re.subn(
              r'zvec:\n(\s+#[^\n]*\n)*\s+path: \.\./\n',
              'zvec: ${TAG_VERSION}\n',
              txt
          )
          if count != 1:
              raise SystemExit('Failed to replace zvec path dependency')
          p.write_text(txt)
          PYEOF
          echo "Updated pubspec.yaml:"
          grep -A2 'zvec:' pubspec.yaml

      - name: Wait for pub.dev indexing and resolve
        working-directory: example
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: waiting 60s for pub.dev indexing..."
            sleep 60
            if flutter pub get; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "::error::Failed to resolve package after 6 attempts"
          exit 1

      - name: Generate iOS platform files
        working-directory: example
        run: |
          flutter create --platforms=ios .
          # zvec requires iOS 14.0+ — uncomment and set platform line
          sed -i '' "s/^# *platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          grep 'platform :ios' ios/Podfile

      - name: Build iOS (device, no codesign)
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Verify zvec.framework
        working-directory: example
        run: |
          echo "=== Searching for zvec.framework ==="
          FRAMEWORK=$(find build -name "zvec.framework" -type d | head -1)
          if [ -z "$FRAMEWORK" ]; then
            echo "::error::zvec.framework NOT found in build output"
            exit 1
          fi
          echo "Found: $FRAMEWORK"
          BINARY="$FRAMEWORK/zvec"
          echo ""
          echo "=== Architecture check ==="
          lipo -info "$BINARY"
          if lipo -info "$BINARY" | grep -q "arm64"; then
            echo "arm64 architecture confirmed"
          else
            echo "::error::arm64 architecture NOT found in zvec.framework"
            exit 1
          fi

      - name: Verify packaged Jieba assets
        working-directory: example
        run: |
          for file in jieba.dict.utf8 hmm_model.utf8; do
            asset=$(find build/ios -path "*/flutter_assets/packages/zvec/assets/jieba_dict/$file" -type f | head -1)
            if [ -z "$asset" ] || [ ! -s "$asset" ]; then
              echo "::error::Missing packaged Jieba asset in iOS build: $file"
              exit 1
            fi
            ls -lh "$asset"
          done

  verify-summary:
    name: Verification summary
    needs: [verify-android, verify-macos-functional, verify-ios]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "============================================"
          echo "  Package ${ZVEC_VERSION} fully verified!"
          echo ""
          echo "  Android: APK contains arm64-v8a libzvec.so and Jieba assets"
          echo "  macOS:   published package passes Jieba FTS integration"
          echo "  iOS:     zvec.framework present with arm64 architecture and Jieba assets"
          echo "============================================"

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to verify without publishing (e.g. v0.8.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - id: version
        name: Check release tag and package
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test "$TAG" = "v$version"
          grep -Fx "## $version" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: flutter pub get && dart pub publish --dry-run

  verify:
    needs: package
    uses: ./.github/workflows/2-test.yml

  publish:
    needs: [package, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get && dart pub publish --force
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  verify-published:
    needs: [package, publish]
    uses: ./.github/workflows/2-test.yml
    with:
      hosted_version: ${{ needs.package.outputs.version }}

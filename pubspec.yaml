name: zvec
description: "Dart SDK for Zvec — a lightweight, lightning-fast, in-process vector database by Alibaba."
version: 0.8.0
homepage: https://github.com/alibaba/zvec
repository: https://github.com/zvec-ai/zvec-dart

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^15.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

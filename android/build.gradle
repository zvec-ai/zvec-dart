group = "com.alibaba.zvec"
version = "0.8.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def sdkDir = layout.buildDirectory.dir("zvec-sdk/android-arm64")
def cApi = sdkDir.map { it.file("lib/libzvec_c_api.so") }
def jniDir = layout.buildDirectory.dir("generated/zvec/jniLibs")

android {
    namespace = "com.alibaba.zvec"
    compileSdk = 36

    defaultConfig {
        minSdk = 28
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets.main.jniLibs.setSrcDirs([jniDir])
}

def flutterProperties = new Properties()
def propertiesFile = rootProject.file("local.properties")
if (propertiesFile.isFile()) {
    propertiesFile.withInputStream { flutterProperties.load(it) }
}
def flutterRoot = flutterProperties.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
def dartBinary = System.getProperty("os.name").startsWith("Windows") ? "dart.exe" : "dart"
def dartCommand = flutterRoot ? new File(flutterRoot, "bin/cache/dart-sdk/bin/${dartBinary}") : dartBinary
def fetchScript = file("../tool/fetch_zvec.dart")

def fetchZvec = tasks.register("fetchZvecSdk", Exec) {
    inputs.files(fetchScript, file("../tool/zvec_sdk.json"))
    outputs.file(cApi)
    commandLine dartCommand, fetchScript, "--target", "android-arm64", "--output", sdkDir.get().asFile
}

def stageZvec = tasks.register("stageZvecNativeLibs", Sync) {
    dependsOn fetchZvec
    from(cApi) { into("arm64-v8a") }
    into(jniDir)
}

tasks.named("preBuild").configure { dependsOn stageZvec }
